appId: com.easyagent.desktop
productName: EasyAgent
copyright: Copyright © 2026 EasyAgent contributors

# Publish to GitHub Releases (for future electron-updater support)
publish:
  provider: github
  owner: hwj123hwj
  repo: easyagent

directories:
  output: release.noindex
  buildResources: build

# Files to include in the app
files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - node_modules/ws/**/*
  - node_modules/semver/**/*
  - "!src"

# Go binary — placed in Contents/Resources/ (not inside asar)
extraResources:
  - from: .bundle/easyagent
    to: easyagent
  - from: .bundle/workflow-runtime.mjs
    to: workflow-runtime.mjs
  - from: .bundle/node
    to: runtime/bin/node
  - from: .bundle/licenses
    to: licenses

# macOS specific
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  sign: ./scripts/sign-adhoc.cjs
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: src/assets/app-icon.png

dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
