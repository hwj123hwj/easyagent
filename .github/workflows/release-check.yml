name: Release build check
on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'scripts/release.py'
      - 'scripts/publish-release.py'
      - 'scripts/build-release.sh'
      - 'scripts/check-release-build.sh'
      - 'scripts/build-desktop.sh'
      - 'scripts/check-desktop*.sh'
      - 'scripts/test_release*.py'
      - 'desktop/**'
      - 'workflow-runtime/**'
      - 'CHANGELOG.md'
      - 'cmd/easyagent*/**'
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/check-release-build.sh
  desktop-build:
    strategy:
      fail-fast: false
      # Desktop installers ship Apple Silicon only; Intel Macs stay on v0.10.1.
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      EA_DESKTOP_NODE_VERSION: v24.21.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise the real desktop release builder with a local-only tag
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p process.arch)" = "$ARCH"
          bash scripts/check-desktop-release-build.sh "$ARCH"
