name: Release build check
on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'scripts/release.py'
      - 'scripts/publish-release.py'
      - 'scripts/build-release.sh'
      - 'scripts/check-release-build.sh'
      - 'scripts/test_cua_helper.py'
      - 'native/computer-use/**'
      - 'scripts/test_release*.py'
      - 'desktop-native/**'
      - 'scripts/build-native.sh'
      - 'scripts/check-native-release-build.sh'
      - 'CHANGELOG.md'
      - 'cmd/easyagent*/**'
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/check-release-build.sh
  native-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-native/go.mod
      - name: Exercise the native release builder
        run: bash scripts/check-native-release-build.sh
