name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated tag, e.g. v0.12.0 or v0.12.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
# Serialize publication; do not cancel a run while uploading assets.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      sha: ${{ steps.policy.outputs.sha }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: policy
        name: Validate exact tag, ancestry, version and release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate "$TAG" --output "$GITHUB_OUTPUT"
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact revision and checksum every asset
        run: bash scripts/build-release.sh "$TAG"
      - name: Publish complete draft without replacing published assets
        run: python3 scripts/publish-release.py "$TAG" "$RELEASE_SHA" dist
