name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated tag, e.g. v0.2.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
env:
  EA_MAC_SIGNING_MODE: adhoc
# Serialize publication; do not cancel a run while uploading assets.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      sha: ${{ steps.policy.outputs.sha }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: policy
        name: Validate exact tag, ancestry, version and release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate "$TAG" --output "$GITHUB_OUTPUT"
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  core:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build core payloads from exact revision
        env:
          TAG: ${{ needs.validate.outputs.version }}
        run: bash scripts/build-release.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-core
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  native:
    needs: [validate, core]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and validate the MyGo native installer
        env:
          TAG: ${{ needs.validate.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bash scripts/build-native.sh darwin-arm64 native-dist "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-native
          path: native-dist/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [validate, core, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble complete manifest and verify every asset
        run: |
          python3 scripts/release.py validate "$TAG"
          python3 scripts/release.py manifest "$TAG" "$RELEASE_SHA" dist
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish complete draft without replacing published assets
        run: python3 scripts/publish-release.py "$TAG" "$RELEASE_SHA" dist
